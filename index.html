<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hazri</title>
<meta name="description" content="Hazri: VC attendance for Udaipur RO. Tracks which branches have joined a Google Meet.">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E141D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-maskable-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app shell — sticky header, scrolling content, bottom tab bar; widens to a centred 560px column on desktop. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EAEEF4; --ink:#142033; --muted:#5B6B80; --faint:#8A97A8; --line:#DCE2EA;
  --accent:#146CC0; --accent-ink:#FFFFFF; --accent-soft:#E1EEFA;
  --in:#12805C; --in-soft:#DDF3EA; --left:#A86A0F; --left-soft:#FBEFD9; --miss:#C2412D; --miss-soft:#FBE4DF;
  --shadow:0 1px 2px rgba(20,32,51,.06),0 4px 16px rgba(20,32,51,.06);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141D; --surface:#161E2A; --surface-2:#1E2836; --ink:#E7ECF3; --muted:#9AA7B9; --faint:#6E7C90; --line:#283346;
  --accent:#5AA6EB; --accent-ink:#071729; --accent-soft:#12304D;
  --in:#3CC08E; --in-soft:#143327; --left:#E2A847; --left-soft:#3A2C12; --miss:#F0735C; --miss-soft:#3D1B16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E141D; --surface:#161E2A; --surface-2:#1E2836; --ink:#E7ECF3; --muted:#9AA7B9; --faint:#6E7C90; --line:#283346;
  --accent:#5AA6EB; --accent-ink:#071729; --accent-soft:#12304D;
  --in:#3CC08E; --in-soft:#143327; --left:#E2A847; --left-soft:#3A2C12; --miss:#F0735C; --miss-soft:#3D1B16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;}

/* Central Bank brand: blue accent, thin red line under the header. Status colours (in / left / miss) are separate. */
.top{box-shadow:inset 0 -2px 0 #D20838}
/* Home: Assembly Arc art under the start card */
.home-art{text-align:center;margin-top:14px}
.home-arc{width:100%;max-width:300px;display:block;margin:0 auto}
.home-arc .ha-f{fill:var(--accent);fill-opacity:.22}
.home-arc .ha-o{fill:var(--accent);fill-opacity:0;stroke:var(--accent);stroke-opacity:.35;stroke-width:2}
.home-arc .ha-s,.home-arc .ha-pod-g{transform-box:fill-box;transform-origin:center}
.home-arc .ha-pod-g{cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
.home-arc .ha-l{fill:#E2A847;fill-opacity:.8}
.home-arc .ha-pod{fill:#FFFFFF;stroke:var(--line)}
.ha-name{font-weight:700;font-size:17px;margin-top:6px}
.ha-sub{color:var(--muted);font-size:13px}
.top canvas.ecg{position:absolute;left:0;right:0;bottom:-18px;width:100%;height:44px;pointer-events:none}
.ecg-on .top{box-shadow:none}
#ptr{position:fixed;left:50%;margin-left:-20px;width:40px;height:40px;display:grid;place-items:center;z-index:15;opacity:0;pointer-events:none}
#ptr img{width:32px;height:32px;filter:drop-shadow(0 1px 2px rgba(20,32,51,.25))}
#ptr.spin img{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
/* Who should attend */
.sheet-body>*{flex-shrink:0}
.att-field{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.att-field:active{background:var(--surface-2)}
.att-field .title{font-weight:600}
.att-field .sub{font-size:13px;color:var(--muted);line-height:1.35}
.att-num{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:54px;height:54px;border-radius:12px;background:var(--accent-soft);color:var(--accent);flex:none;line-height:1.1}
.att-num b{font-family:var(--mono);font-size:21px;font-weight:600}
.att-num span{font-size:11px;font-weight:500;opacity:.85}
.att-chev{flex:none;color:var(--faint);display:grid}
.att-chev svg{width:20px;height:20px}
.att-presets{display:flex;flex-wrap:wrap;gap:8px}
.att-presets .pick{font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer}
.att-presets .pick b{font-family:var(--mono);font-weight:600;margin-left:6px;opacity:.6;font-size:12px}
.att-ro{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.att-group{display:flex;align-items:center;gap:8px;padding:8px 2px 6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.att-grp-btn{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;text-transform:none;letter-spacing:0;font-weight:600;padding:4px 2px;cursor:pointer}
.att-row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:inherit;color:var(--ink);text-align:left;cursor:pointer;margin-bottom:6px;transition:background .15s,border-color .15s}
.att-row .title{font-weight:500}
.att-row .sub{font-size:12px;color:var(--accent)}
.att-row[aria-pressed="true"]{border-color:transparent;background:var(--accent-soft)}
.att-tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;transition:background .15s,border-color .15s}
.att-tick svg{width:14px;height:14px;stroke-width:3}
.att-row[aria-pressed="true"] .att-tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.brand-mark{width:32px;height:32px;border-radius:8px;object-fit:cover;flex:none;margin-right:-2px;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.join-btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;text-decoration:none;flex:none}
.join-btn svg{width:18px;height:18px}

*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior-y:contain}
html{scroll-padding-bottom:110px;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.tnum{font-variant-numeric:tabular-nums}

/* Shell */
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;display:flex;align-items:center;gap:12px}
.top h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;flex:none}
main{flex:1;padding:4px 16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{border:0;background:none;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--muted);border-radius:12px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .ic-wrap{background:var(--accent-soft)}
.ic-wrap{padding:3px 18px;border-radius:999px;display:grid;place-items:center;transition:background .2s}

/* Generic */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.sec-label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 2px -4px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-decoration:none}
.btn svg{width:20px;height:20px;flex:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-soft{background:var(--accent-soft);color:var(--accent)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-danger{background:var(--miss-soft);color:var(--miss)}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.in{background:var(--in-soft);color:var(--in)} .chip.left{background:var(--left-soft);color:var(--left)} .chip.miss{background:var(--miss-soft);color:var(--miss)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.list{display:flex;flex-direction:column}
.list > * + *{border-top:1px solid var(--line)}
.item{padding:13px 16px;display:flex;align-items:center;gap:12px;min-height:60px}
.item.tap{cursor:pointer;width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left}
.list > .item.tap:first-child{border-top:0}
.code{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:2px 6px;min-width:46px;text-align:center;flex:none}
.title{font-weight:600}
.sub{font-size:13px;color:var(--muted)}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.call-btn{border:0;background:var(--in);color:#fff;border-radius:12px;height:42px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-weight:600;text-decoration:none;flex:none}
:root[data-theme="dark"] .call-btn{color:#06130D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .call-btn{color:#06130D}}
.call-btn svg{width:18px;height:18px}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.input,textarea.input,select.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:48px;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical;min-height:84px}
.hint{font-size:12.5px;color:var(--faint)}
.picks{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.picks::-webkit-scrollbar{display:none}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;white-space:nowrap}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 4px;font-size:13px;line-height:1.25;font-weight:500;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.setting{display:flex;align-items:center;gap:12px;padding:14px 16px}
.setting .grow .title{font-weight:500}

/* Home */
.hero{padding:22px 20px 20px;display:flex;flex-direction:column;gap:16px}
.hero h2{margin:0;font-size:24px;line-height:1.2;letter-spacing:-.015em;text-wrap:balance}
.hero p{margin:0;color:var(--muted)}
.actions{display:grid;gap:10px}

/* Live board */
.meet-head{padding:16px;display:flex;flex-direction:column;gap:14px}
.meet-meta{display:flex;flex-direction:column;gap:4px}
.meet-meta .agenda{font-size:17px;font-weight:600;line-height:1.3;text-wrap:balance}
.score{display:flex;align-items:center;gap:16px}
.ring{width:92px;height:92px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ring .num b{font-family:var(--mono);font-size:24px;font-weight:600}
.ring .num span{font-size:11px;color:var(--muted);margin-top:3px}
.tallies{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;min-width:0}
.tally{border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.tally b{font-family:var(--mono);font-size:20px;font-weight:600;line-height:1.1}
.tally span{font-size:11.5px;font-weight:500}
.tally.in{background:var(--in-soft);color:var(--in)} .tally.left{background:var(--left-soft);color:var(--left)} .tally.miss{background:var(--miss-soft);color:var(--miss)}
.syncbar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.untagged{padding:12px 16px;display:flex;flex-direction:column;gap:10px;border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line))}
.untagged-list{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.untagged-list::-webkit-scrollbar{display:none}
.u-pill{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:8px 12px;font-weight:600;font-size:13.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.u-pill svg{width:16px;height:16px}
.board-tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:10;background:var(--bg);padding:2px 0 4px}
.stripe{width:4px;align-self:stretch;border-radius:4px;flex:none}
.stripe.in{background:var(--in)} .stripe.left{background:var(--left)} .stripe.miss{background:var(--miss)}
.people-inline{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.called{font-size:12px;color:var(--in);font-weight:600}
.flash{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,20,.45);z-index:50;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;max-height:88%;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 2px;flex:none}
.sheet-head{padding:8px 16px 10px;display:flex;align-items:flex-start;gap:12px;flex:none}
.sheet-head h3{margin:0;font-size:18px;line-height:1.3}
.sheet-body{overflow-y:auto;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;flex:none}
.sug{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;width:100%}
.sug.best{border-color:var(--accent);background:var(--accent-soft)}
.sug .meter{font-family:var(--mono);font-size:12px;color:var(--muted)}
.results{display:flex;flex-direction:column;gap:8px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);transition:all .25s;pointer-events:none;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:700;padding:6px 8px;border-radius:8px}
:root[data-theme="dark"] .toast button{color:var(--accent-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast button{color:#1F49B6}}

/* Share preview */
.preview{background:var(--surface-2);border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:14px;line-height:1.5;word-break:break-word}
.share-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.banner{border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.banner svg{width:18px;height:18px;flex:none;margin-top:1px}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.banner.warn{background:var(--left-soft);color:var(--ink)}
.banner.err{background:var(--miss-soft);color:var(--ink)}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint)}
.search-wrap .input{padding-left:42px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;word-break:break-word}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--muted);flex:none}
.avatar.g{background:var(--accent-soft);color:var(--accent)}
/* Call status */
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:48px;padding:10px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.status-btn::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--faint)}
.status-btn.s-informed::before{background:var(--in)} .status-btn.s-recall::before{background:var(--left)} .status-btn.s-denied::before{background:var(--miss)}
.status-btn[aria-pressed="true"].s-informed{border-color:var(--in);background:var(--in-soft);color:var(--in)}
.status-btn[aria-pressed="true"].s-recall{border-color:var(--left);background:var(--left-soft);color:var(--left)}
.status-btn[aria-pressed="true"].s-denied{border-color:var(--miss);background:var(--miss-soft);color:var(--miss)}
.status-btn[aria-pressed="true"].s-noanswer{border-color:var(--muted);background:var(--surface-2)}
.plain{border:0;background:none;padding:0;margin:0;text-align:left;display:flex;align-items:center;gap:12px;min-width:0;color:inherit;font:inherit}
.icon-btn.call{background:var(--in-soft);color:var(--in);text-decoration:none}
.slide-l{animation:slideL .22s ease-out} .slide-r{animation:slideR .22s ease-out}
@keyframes slideL{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:600px){main{padding-top:8px}}
</style>
